<!doctype html>
<html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Flappy 3D</title><script type="module" src="https://unpkg.com/three@0.160.0/build/three.module.js"></script><style>body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;color:white;text-align:center;text-shadow:0 2px 6px #000}h1{font-size:48px;margin:25px 0 0}#score{font-size:42px;font-weight:bold}#msg{margin-top:20px;font-size:20px}</style></head><body><div id="ui"><h1>FLAPPY 3D</h1><div id="score">0</div><div id="msg">Click or press SPACE to start</div></div><script type="module">import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';const s=new THREE.Scene(),c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);c.position.set(0,0,12);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);s.add(new THREE.HemisphereLight(0xffffff,0x444444,2));const bird=new THREE.Mesh(new THREE.SphereGeometry(.5,24,16),new THREE.MeshStandardMaterial({color:0xffd43b}));s.add(bird);const pipes=[];function pipe(x,y,h){const m=new THREE.Mesh(new THREE.BoxGeometry(1.5,h,2),new THREE.MeshStandardMaterial({color:0x32b85c}));m.position.set(x,y,0);s.add(m);pipes.push(m)}for(let x=6;x<30;x+=7){let gapY=(Math.random()-.5)*3,g=3.2;pipe(x,gapY+g/2+4,8);pipe(x,gapY-g/2-4,8)}let vy=0,run=false,score=0,lastX=0;function flap(){if(!run){run=true;document.querySelector('#msg').textContent='';}vy=.16}addEventListener('keydown',e=>{if(e.code==='Space')flap()});addEventListener('pointerdown',flap);function loop(){requestAnimationFrame(loop);if(run){vy-=.008;bird.position.y+=vy;bird.rotation.z=-vy*3;if(bird.position.y<-5||bird.position.y>5){run=false;document.querySelector('#msg').textContent='Game Over — Click to restart';score=0;document.querySelector('#score').textContent=score;bird.position.set(0,0,0);vy=0}pipes.forEach(p=>{p.position.x-=.055;if(p.position.x<-.8&&p.userData.hit!==true){p.userData.hit=true;score++;document.querySelector('#score').textContent=Math.floor(score/2)}if(Math.abs(p.position.x)<.9&&Math.abs(bird.position.y-p.position.y)<p.geometry.parameters.height/2+.4){run=false;document.querySelector('#msg').textContent='Game Over — Click to restart'}})}r.render(s,c)}loop();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
