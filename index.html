<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"/><title>Flappy 3D</title><link rel="stylesheet" href="./styles/main.css"/></head><body><div id="game"></div><div id="ui"><header class="topbar"><div class="brand">FLAPPY <span>3D</span></div><div class="score-panel"><span class="label">SCORE</span><div id="score">0</div></div></header><div id="msg" class="message">Tap anywhere to start</div><section id="gameOver" class="game-over hidden" aria-live="polite"><div class="result-card"><p class="eyebrow">GAME OVER</p><h1>Your Flight</h1><div class="final-score"><span>FINAL SCORE</span><strong id="finalScore">0</strong></div><p id="newBest" class="best"></p><p class="restart">Tap anywhere to fly again</p></div></section></div><script type="module" src="./src/main.js"></script></body></html>
